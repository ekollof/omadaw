# OmaDAW "studio" profile — ~2.7 ms @ 48 kHz (128 frames).
# Installed to ~/.config/pipewire/pipewire.conf.d/10-omadaw.conf by omadaw.
# Reference: pipewire.conf(5). Quantum*rate = latency; 128/48000 = 2.67 ms.
# force-quantum pins the graph: JACK clients (Reaper/Ardour/Carla via
# pipewire-jack) require a FIXED buffer size and die when the dynamic quantum
# jumps underneath them (observed: SIGKILL during JACK probe, Carla
# "nframes == bufferSize" 512-vs-128 assertion). No dynamic scaling in studio.
context.properties = {
    default.clock.rate        = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 ]
    default.clock.quantum     = 128
    default.clock.min-quantum = 128
    default.clock.max-quantum = 128
    default.clock.force-quantum = 128
}
