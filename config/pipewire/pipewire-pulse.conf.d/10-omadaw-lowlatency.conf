# OmaDAW low-latency tuning for pipewire-pulse (Reaper's PulseAudio backend).
# Stock pipewire-pulse negotiates large buffers (default.req 960, default.frag
# 96000 = 2s capture!) which showed up as ~75-105ms in Reaper. These clamp the
# negotiation so DAW streams stay tight. Desktop apps (browser, notifications)
# still work — they just wake up more often (negligible on a studio box).
# NOTE: these keys belong in pulse.properties (the protocol-pulse module
# reads them there), NOT context.properties.
pulse.properties = {
    pulse.min.req      = 128/48000
    pulse.default.req  = 384/48000
    pulse.max.req      = 1024/48000
    pulse.min.frag     = 128/48000
    pulse.default.frag = 384/48000
    pulse.max.frag     = 1024/48000
    pulse.min.quantum  = 128/48000
    pulse.max.quantum  = 1024/48000
}
